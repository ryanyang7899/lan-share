<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网共享</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="brand-dot"></span>局域网共享</div>
  <div class="user-area">
    <span class="me-badge" id="me-name" title="昵称与账户绑定">…</span>
    <button type="button" class="link" id="logout-btn">登出</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="board">📋 公告板</button>
  <button class="tab" data-tab="files">📁 文件</button>
  <button class="tab" data-tab="chat">💬 聊天</button>
  <button class="tab" data-tab="accounts">👤 账户</button>
</nav>

<main>
  <!-- 公告板 -->
  <section id="board" class="panel active">
    <form id="post-form" class="composer">
      <div class="composer-top">
        <textarea id="post-content" rows="4" placeholder="写点什么，共享给大家…（Enter 发送，Shift+Enter 换行，支持 Markdown）" maxlength="4000"></textarea>
        <div id="post-preview" class="md-preview hidden"></div>
      </div>
      <div class="composer-row">
        <div class="md-toggle">
          <button type="button" class="md-switch active" data-mode="write" data-target="post">输入</button>
          <button type="button" class="md-switch" data-mode="preview" data-target="post">预览</button>
        </div>
        <div class="composer-actions">
          <select id="post-ttl">
            <option value="86400">保留 1 天</option>
            <option value="259200">保留 3 天</option>
            <option value="604800" selected>保留 7 天</option>
            <option value="2592000">保留 30 天</option>
            <option value="0">永久</option>
          </select>
          <button type="submit" class="primary">发布</button>
        </div>
      </div>
    </form>
    <ul id="post-list" class="list"></ul>
  </section>

  <!-- 文件 -->
  <section id="files" class="panel">
    <div id="dropzone" class="dropzone">
      <div class="dz-text">把文件拖到这里，或点击选择</div>
      <input type="file" id="file-input" multiple hidden>
      <div class="composer-row">
        <select id="file-ttl">
          <option value="86400">保留 1 天</option>
          <option value="259200">保留 3 天</option>
          <option value="604800" selected>保留 7 天</option>
          <option value="2592000">保留 30 天</option>
          <option value="0">永久</option>
        </select>
      </div>
    </div>
    <div id="upload-progress" class="progress hidden">
      <div class="progress-label" id="upload-progress-label">上传中…</div>
      <div class="progress-track"><div class="progress-bar" id="upload-progress-bar"></div></div>
    </div>
    <ul id="file-list" class="list"></ul>
  </section>

  <!-- 聊天 -->
  <section id="chat" class="panel">
    <div id="chat-box" class="chat-box"></div>
    <form id="chat-form" class="composer">
      <div class="composer-top">
        <textarea id="chat-input" rows="1" maxlength="4000" placeholder="回车发送，Shift+Enter 换行，支持 Markdown…"></textarea>
        <div id="chat-preview" class="md-preview hidden"></div>
      </div>
      <div class="composer-row">
        <div class="md-toggle">
          <button type="button" class="md-switch active" data-mode="write" data-target="chat">输入</button>
          <button type="button" class="md-switch" data-mode="preview" data-target="chat">预览</button>
        </div>
        <div class="composer-actions">
          <select id="chat-ttl">
            <option value="0" selected>永不过期</option>
            <option value="86400">保留 1 天</option>
            <option value="259200">保留 3 天</option>
            <option value="604800">保留 7 天</option>
            <option value="2592000">保留 30 天</option>
          </select>
          <button type="submit" class="primary">发送</button>
        </div>
      </div>
    </form>
  </section>

  <!-- 账户 -->
  <section id="accounts" class="panel">
    <!-- 所有登录用户：修改自己的密码 -->
    <div class="card">
      <h3 class="card-title">修改我的密码</h3>
      <form id="self-pass-form" class="inline-form">
        <input id="old-pass" type="password" placeholder="原密码" autocomplete="current-password" required>
        <input id="new-pass" type="password" placeholder="新密码（4-128 位）" autocomplete="new-password" required>
        <button type="submit" class="primary">修改</button>
      </form>
      <div id="self-msg" class="form-msg hidden"></div>
    </div>

    <!-- 仅管理员：子账户管理 -->
    <div class="card admin-only hidden">
      <h3 class="card-title">新增子账户</h3>
      <p class="card-hint">账户名将作为该用户在公告板 / 聊天 / 文件中的昵称，创建后不可更改。</p>
      <form id="user-form" class="inline-form">
        <input id="new-username" maxlength="20" placeholder="账户名（同时作为昵称）" required>
        <input id="new-password" type="password" placeholder="密码（4-128 位）" required>
        <button type="submit" class="primary">添加</button>
      </form>
      <div id="user-msg" class="form-msg hidden"></div>
    </div>

    <div class="card admin-only hidden">
      <h3 class="card-title">账户列表</h3>
      <ul id="user-list" class="list"></ul>
    </div>

    <div class="card admin-only hidden">
      <h3 class="card-title">已锁定的 IP</h3>
      <p class="card-hint">同一 IP 连续登录失败 5 次会被锁定 24 小时，可在此手动解锁。</p>
      <ul id="locked-list" class="list"></ul>
    </div>
  </section>
</main>

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/md.js"></script>
<script src="/app.js"></script>
</body>
</html>
